[package]
name = "discoas-core"
version = "2.0.2"
edition = "2021"
description = "Platform metadata, discovery rules and local storage for DiscoAS"
repository = "https://github.com/caipeilan/DiscoAS"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
md5 = "0.7"
once_cell = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
# QQ request signatures preserve JSON insertion order.
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
